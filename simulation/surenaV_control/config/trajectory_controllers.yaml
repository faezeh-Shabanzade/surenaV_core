# Auto-generated from surenaV_description/urdf/surenaV.urdf (full body + hands,
# 51 revolute joints). Regenerate/check with scripts/validate_urdf_and_configs.py.
#
# Uses the DIRECT command interfaces (no PID loop here): the transmission's
# hardware_interface/PositionJointInterface maps the command straight to the
# simulated (or physical) actuator's internal position loop.

#
# Group-wise coordinated motion. joint_trajectory_controller in ROS 1 Noetic is
# compiled against the PositionJointInterface, so these load only in the
# position-control session (surenaV_position.urdf). They are loaded STOPPED by
# the launch files; activate with controller_manager/switch_controller (see
# scripts/switch_control_mode.py).
#
surenaV:
  head_trajectory_controller:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - head_yaw_joint
      - head_pitch_joint
      - head_roll_joint
    gains:
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.05
    state_publish_rate: 100
    action_monitor_rate: 20

  r_leg_trajectory_controller:
