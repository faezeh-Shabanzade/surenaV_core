# Joint limits for Surena V -- values taken from the URDF <limit> tags.
# effort=1000 on body joints is the SolidWorks export placeholder, NOT a
# verified actuator spec (real EPOS4 torque limits unknown -> marked UNKNOWN).
# Acceleration limits are not in the URDF; the values below are conservative
# defaults used only by the PyBullet command ramping, not verified specs.
#
